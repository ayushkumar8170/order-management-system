services:
  mysql:
    image: mysql:8.4
    container_name: oms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: oms_db
      MYSQL_USER: oms_user
      MYSQL_PASSWORD: oms_password
    ports:
      - "3306:3306"
    volumes:
      - oms-mysql-data:/var/lib/mysql
      # Files here run once, alphabetically, on first container start.
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "oms_user", "-poms_password"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: oms-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: oms_db
      DB_USER: oms_user
      DB_PASSWORD: oms_password
      DB_POOL_SIZE: 10
    volumes:
      - ./logs:/app/logs

volumes:
  oms-mysql-data:
